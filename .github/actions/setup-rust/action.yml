name: "Setup Rust"
description: "Install system deps, Rust toolchain, and configure caching for CI jobs"

inputs:
  toolchain:
    description: "Rust toolchain (stable or nightly)"
    required: false
    default: "stable"
  components:
    description: "Comma-separated Rust components (e.g. clippy, rustfmt, miri)"
    required: false
    default: ""
  shared-key:
    description: "Shared cache key for Swatinem/rust-cache"
    required: true
  save-cache:
    description: "Whether to save the cache (false for read-only consumers)"
    required: false
    default: "true"
  extra-apt:
    description: "Additional apt packages to install (space-separated)"
    required: false
    default: ""
  extra-brew:
    description: "Additional Homebrew packages to install (space-separated)"
    required: false
    default: ""
  cache-workspaces:
    description: "Workspaces for rust-cache (e.g. 'fuzz -> target')"
    required: false
    default: ""
  targets:
    description: "Additional rustup targets to install (e.g. x86_64-unknown-linux-musl)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Stub Gossip-rs path deps
      shell: bash
      run: |
        # Cargo resolves path deps at manifest parse time even when optional.
        # Create minimal stubs so the connector-pipeline deps resolve in CI
        # (the feature is never activated, so these are never compiled).
        for crate in gossip-contracts gossip-connectors; do
          dir="../Gossip-rs/crates/${crate}"
          if [ ! -d "${dir}" ]; then
            mkdir -p "${dir}/src"
            printf '[package]\nname = "%s"\nversion = "0.0.0"\nedition = "2021"\n' "${crate}" > "${dir}/Cargo.toml"
            printf '\n' > "${dir}/src/lib.rs"
          fi
        done

    - name: Install system deps (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-dev mold ${{ inputs.extra-apt }}

    - name: Configure mold linker (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p .cargo
        printf '[target.x86_64-unknown-linux-gnu]\nlinker = "clang"\nrustflags = ["-C", "link-arg=-fuse-ld=mold"]\n' >> .cargo/config.toml

    - name: Install system deps (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install boost ${{ inputs.extra-brew }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      with:
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-cache }}
        workspaces: ${{ inputs.cache-workspaces }}
