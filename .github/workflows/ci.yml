name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-22.04
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule') && '32' || '4' }}
      PROPTEST_FUZZ_MULTIPLIER: ${{ (github.event_name == 'schedule') && '2' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
      - run: cargo test --features stdx-proptest,integration-tests,property-tests,diagnostic-tests,smoke-tests

  test-aarch64:
    name: Test (aarch64)
    runs-on: macos-14
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule') && '32' || '4' }}
      PROPTEST_FUZZ_MULTIPLIER: ${{ (github.event_name == 'schedule') && '2' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: brew install boost
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-14
      - run: cargo test --features stdx-proptest,integration-tests,property-tests,diagnostic-tests,smoke-tests

  test-full-harness:
    name: Test (Scheduled, Full Harness)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    env:
      PROPTEST_CASES: "64"
      PROPTEST_FUZZ_MULTIPLIER: "4"
      SCHEDULER_SIM_STRESS_SEEDS: "2000"
      SCHEDULER_SIM_STRESS_MAX_STEPS: "2000"
      SCHEDULER_SIM_STRESS_MAX_PROGRAMS: "8"
      SCHEDULER_SIM_STRESS_MAX_TASKS: "8"
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
      - run: cargo test --lib --bins --tests --examples --features stdx-proptest,tiger-harness,scheduler-sim,integration-tests,property-tests,diagnostic-tests,smoke-tests,perf-stats

  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-loom
      - name: Run loom tests
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test --lib -- loom_tests

  fuzz-pack-smoke:
    name: Fuzz Pack Smoke (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    env:
      # ~20s per target × 4 targets ≈ 80s total (within 60-120s budget).
      FUZZ_SECONDS: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pack:
              - 'src/git_scan/pack_*'
              - 'fuzz/fuzz_targets/fuzz_pack_*'
              - 'fuzz/corpus/**'
      - uses: dtolnay/rust-toolchain@nightly
        if: steps.filter.outputs.pack == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.pack == 'true'
        with:
          key: ubuntu-22.04-fuzz
          workspaces: fuzz -> target
      - name: Install LLVM
        if: steps.filter.outputs.pack == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libboost-dev
      - name: Install cargo-fuzz
        if: steps.filter.outputs.pack == 'true'
        run: cargo install cargo-fuzz
      - name: Restore fuzz corpus cache
        if: steps.filter.outputs.pack == 'true'
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-pack-${{ hashFiles('fuzz/corpus/fuzz_pack_*/**') }}
          restore-keys: |
            fuzz-corpus-pack-
      - name: Run pack fuzz targets
        if: steps.filter.outputs.pack == 'true'
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_pack_parse_delta    -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream  -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_delta_into      -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_exec            -- -max_total_time=${FUZZ_SECONDS}
      - name: Skip — no pack files changed
        if: steps.filter.outputs.pack != 'true'
        run: echo "No pack-related files changed; skipping fuzz smoke."

  fuzz-linux:
    name: Fuzz (Scheduled, Nightly Only, Linux)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    env:
      FUZZ_RUNS: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libboost-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-nightly-linux-${{ hashFiles('fuzz/corpus/fuzz_pack_*/**') }}
          restore-keys: |
            fuzz-corpus-nightly-linux-
      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_anchor_soundness -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_build_and_scan -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_determinism -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_differential -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_parse_delta -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_delta_into -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_exec -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_json_write_equivalence -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_encode_pipeline -- -runs=${FUZZ_RUNS}

  fuzz-macos:
    name: Fuzz (Scheduled, Nightly Only, macOS)
    if: github.event_name == 'schedule'
    runs-on: macos-14
    env:
      FUZZ_RUNS: 10000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-14
      - name: Install system deps
        run: brew install boost
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-nightly-macos-${{ hashFiles('fuzz/corpus/fuzz_pack_*/**') }}
          restore-keys: |
            fuzz-corpus-nightly-macos-
      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          export BOOST_ROOT="$(brew --prefix boost)"
          export CMAKE_PREFIX_PATH="${BOOST_ROOT}:${CMAKE_PREFIX_PATH:-}"
          cargo +nightly fuzz run fuzz_anchor_soundness -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_build_and_scan -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_determinism -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_differential -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_parse_delta -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_delta_into -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_exec -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_json_write_equivalence -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_encode_pipeline -- -runs=${FUZZ_RUNS}

  miri:
    name: Miri (Scheduled, Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    env:
      # strict-provenance: catches pointer provenance violations in node_pool,
      #   scratch_memory, set_associative_cache raw-pointer arithmetic.
      # symbolic-alignment-check: catches misaligned access in from_raw_parts.
      # preemption-rate: enables thread interleaving for spsc, atomic_bitset
      #   concurrent tests — higher than default to exercise more schedules.
      MIRIFLAGS: >-
        -Zmiri-strict-provenance
        -Zmiri-symbolic-alignment-check
        -Zmiri-preemption-rate=0.1
        -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-miri
      - name: Run Miri on lib tests (skip FFI-dependent modules)
        run: |
          cargo +nightly miri test --lib -- \
            --skip engine:: \
            --skip git_scan:: \
            --skip scheduler::affinity \
            --skip scheduler::device_slots \
            --skip scheduler::rusage \
            --skip scheduler::local_fs_uring \
            --skip scheduler::engine_impl \
            --skip scheduler::parallel_scan \
            --skip rules::yaml \
            --skip archive::scan \
            --skip archive::formats::gzip \
            --skip archive::formats::zip::tests::long_name \
            --skip archive::formats::zip::tests::in_memory

  kani:
    name: Kani Verification (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - name: Install Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: "0.67.0"
      - name: Run Kani proofs
        run: cargo kani --features kani

  audit:
    name: Security Audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  benchmark:
    name: Benchmark (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-bench
      - name: Run benchmarks
        run: cargo bench --features bench --bench event_encoding -- --output-format bencher | tee output.txt
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: output.txt
          alert-threshold: "130%"
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'schedule' }}
