name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.beads/**'
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # ---------------------------------------------------------------------------
  # Path filtering — skip expensive jobs on docs-only PRs
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'default_rules.yaml'
              - '.github/**'
            fuzz:
              - 'fuzz/**'
              - 'src/**'

  # ---------------------------------------------------------------------------
  # fmt, clippy, test  (parallel — each depends only on path filtering)
  # ---------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          components: rustfmt

      # Cargo resolves path deps at manifest parse time even when optional.
      # Stub Gossip-rs so cargo fmt can parse Cargo.toml in CI.
      - name: Stub Gossip-rs path deps
        run: |
          for crate in gossip-contracts gossip-connectors; do
            dir="../Gossip-rs/crates/${crate}"
            if [ ! -d "${dir}" ]; then
              mkdir -p "${dir}/src"
              printf '[package]\nname = "%s"\nversion = "0.0.0"\nedition = "2021"\n' "${crate}" > "${dir}/Cargo.toml"
              printf '\n' > "${dir}/src/lib.rs"
            fi
          done

      # No cache needed — fmt does not compile
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: stable-linux

      # Note: --all-features is not used because connector-pipeline requires
      # a local path dep (Gossip-rs) not available in CI. List all other features.
      - run: >-
          cargo clippy --all-targets
          --features stdx-proptest,kgram-gate,perf-stats,stats,b64-stats,bench,tiger-harness,sim-harness,kani,scheduler-sim,integration-tests,property-tests,smoke-tests,diagnostic-tests,rocksdb,aegis-pure-rust,git-perf,real-rules-harness
          -- -D warnings

      - name: Show cache stats
        if: always()
        run: du -sh target/ || true

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule') && '32' || '4' }}
      PROPTEST_FUZZ_MULTIPLIER: ${{ (github.event_name == 'schedule') && '2' || '1' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux

      - run: cargo nextest run --features stdx-proptest,integration-tests,property-tests,diagnostic-tests,smoke-tests
      - run: cargo test --doc

      - name: Show cache stats
        if: always()
        run: du -sh target/ || true

  execution-mode-parity:
    name: Execution Mode Parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes, clippy]
    env:
      EXECUTION_MODE_PARITY_ITERS: "5"
      EXECUTION_MODE_PARITY_MEDIAN_MAX_PCT: "2"
      EXECUTION_MODE_PARITY_PER_CASE_MAX_PCT: "5"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
      - run: cargo test --features integration-tests --test integration execution_mode_parity_ -- --nocapture

  sustained-green-report:
    name: Sustained Green Report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [execution-mode-parity, test, test-aarch64, clippy]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Generate sustained-green policy report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools/migration-parity/results
          python3 tools/migration-parity/sustained_green_gate.py \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --branch main \
            --output-json tools/migration-parity/results/sustained_green_report.json \
            --output-markdown tools/migration-parity/results/sustained_green_report.md
          cat tools/migration-parity/results/sustained_green_report.md

  eval-harness:
    name: Eval Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes, clippy]
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule') && '32' || '4' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: rustfmt, clippy
          shared-key: eval-harness-linux
          cache-workspaces: "tools/eval-harness -> target"
      - run: cargo fmt --check
        working-directory: tools/eval-harness
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: tools/eval-harness
      - run: cargo test
        working-directory: tools/eval-harness

  clippy-aarch64:
    name: Clippy (aarch64)
    runs-on: macos-15
    timeout-minutes: 20
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: stable-macos
      # Note: --all-features is not used because connector-pipeline requires
      # a local path dep (Gossip-rs) not available in CI. List all other features.
      - run: >-
          cargo clippy --all-targets
          --features stdx-proptest,kgram-gate,perf-stats,stats,b64-stats,bench,tiger-harness,sim-harness,kani,scheduler-sim,integration-tests,property-tests,smoke-tests,diagnostic-tests,rocksdb,aegis-pure-rust,git-perf,real-rules-harness
          -- -D warnings

  test-aarch64:
    name: Test (aarch64)
    runs-on: macos-15
    timeout-minutes: 30
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule') && '32' || '4' }}
      PROPTEST_FUZZ_MULTIPLIER: ${{ (github.event_name == 'schedule') && '2' || '1' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-macos

      - run: cargo nextest run --features stdx-proptest,integration-tests,property-tests,diagnostic-tests,smoke-tests
      - run: cargo test --doc

  # ---------------------------------------------------------------------------
  # Scheduled: full harness (runs after clippy for cache reuse)
  # ---------------------------------------------------------------------------
  test-full-harness:
    name: Test (Scheduled, Full Harness)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [clippy]
    env:
      PROPTEST_CASES: "64"
      PROPTEST_FUZZ_MULTIPLIER: "4"
      SCHEDULER_SIM_STRESS_SEEDS: "2000"
      SCHEDULER_SIM_STRESS_MAX_STEPS: "2000"
      SCHEDULER_SIM_STRESS_MAX_PROGRAMS: "8"
      SCHEDULER_SIM_STRESS_MAX_TASKS: "8"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo nextest run --lib --bins --tests --examples --features stdx-proptest,tiger-harness,scheduler-sim,integration-tests,property-tests,diagnostic-tests,smoke-tests,perf-stats
      - run: cargo test --doc

  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: loom-linux
      - name: Run loom tests
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test --lib -- loom_tests

  # ---------------------------------------------------------------------------
  # Security audit (independent, always runs)
  # ---------------------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Fuzz: PR smoke test
  # ---------------------------------------------------------------------------
  fuzz-pack-smoke:
    name: Fuzz Pack Smoke (PR)
    if: github.event_name == 'pull_request' && needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    env:
      FUZZ_SECONDS: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-linux-fuzz
          extra-apt: "clang llvm"
          cache-workspaces: "fuzz -> target"

      - uses: ./.github/actions/setup-cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-pack-${{ hashFiles('fuzz/corpus/fuzz_pack_*/**') }}
          restore-keys: |
            fuzz-corpus-pack-

      - name: Run pack fuzz targets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_pack_parse_delta    --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream  --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_delta_into      --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_exec            --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}

  # ---------------------------------------------------------------------------
  # Fuzz: scheduled nightly (Linux)
  # ---------------------------------------------------------------------------
  fuzz-linux:
    name: Fuzz (Scheduled, Nightly Only, Linux)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FUZZ_RUNS: 10000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-linux-fuzz
          extra-apt: "clang llvm"
          cache-workspaces: "fuzz -> target"

      - uses: ./.github/actions/setup-cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-nightly-linux-${{ hashFiles('fuzz/corpus/**') }}
          restore-keys: |
            fuzz-corpus-nightly-linux-

      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_anchor_soundness --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_build_and_scan --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_determinism --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_differential --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_parse_delta --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_delta_into --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_exec --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_json_write_equivalence --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_encode_pipeline --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_tiger_chunking --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_atomic_bitset --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_vs_cache_load --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pyc_extract --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_java_class_extract --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_hit_pool_callback --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_text_sanitize_path --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_simd_classify --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_offline_validators --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}

  # ---------------------------------------------------------------------------
  # Fuzz: scheduled nightly (macOS)
  # ---------------------------------------------------------------------------
  fuzz-macos:
    name: Fuzz (Scheduled, Nightly Only, macOS)
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FUZZ_RUNS: 10000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-macos-fuzz
          cache-workspaces: "fuzz -> target"

      - uses: ./.github/actions/setup-cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-nightly-macos-${{ hashFiles('fuzz/corpus/**') }}
          restore-keys: |
            fuzz-corpus-nightly-macos-

      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          export BOOST_ROOT="$(brew --prefix boost)"
          export CMAKE_PREFIX_PATH="${BOOST_ROOT}:${CMAKE_PREFIX_PATH:-}"
          cargo +nightly fuzz run fuzz_anchor_soundness --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_build_and_scan --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_determinism --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_differential --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_parse_delta --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_delta_into --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_exec --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_json_write_equivalence --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_encode_pipeline --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_tiger_chunking --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_atomic_bitset --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_vs_cache_load --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pyc_extract --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_java_class_extract --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_hit_pool_callback --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_text_sanitize_path --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_simd_classify --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_offline_validators --target aarch64-apple-darwin -- -runs=${FUZZ_RUNS}

  # ---------------------------------------------------------------------------
  # Miri: scheduled nightly
  # ---------------------------------------------------------------------------
  miri:
    name: Miri (Scheduled, Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIRIFLAGS: >-
        -Zmiri-strict-provenance
        -Zmiri-symbolic-alignment-check
        -Zmiri-preemption-rate=0.1
        -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
          shared-key: nightly-linux-miri

      - name: Run Miri on lib tests (skip FFI-dependent modules)
        run: |
          cargo +nightly miri test --lib -- \
            --skip engine::core \
            --skip engine::tests \
            --skip engine::vectorscan_prefilter \
            --skip engine::vs_cache \
            --skip engine::buffer_scan \
            --skip engine::stream_decode \
            --skip engine::scratch \
            --skip engine::transform \
            --skip git_scan:: \
            --skip scheduler::affinity \
            --skip scheduler::device_slots \
            --skip scheduler::rusage \
            --skip scheduler::local_fs_uring \
            --skip scheduler::engine_impl \
            --skip scheduler::parallel_scan \
            --skip rules::yaml \
            --skip archive::scan \
            --skip archive::formats::bzip2 \  # FFI: C libbzip2 backend
            --skip archive::formats::gzip \   # FFI: C libz backend
            --skip archive::formats::zip::tests::long_name \
            --skip archive::formats::zip::tests::in_memory

  # ---------------------------------------------------------------------------
  # ASAN: scheduled nightly
  # ---------------------------------------------------------------------------
  asan:
    name: AddressSanitizer (Scheduled, Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-Zsanitizer=address"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rust-src
          shared-key: nightly-linux-asan

      - name: Run ASAN tests on SIMD and offline_validate modules
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --lib -- engine::simd_classify engine::offline_validate

  # ---------------------------------------------------------------------------
  # Kani: scheduled verification
  # ---------------------------------------------------------------------------
  kani:
    name: Kani Verification (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: kani-linux
          save-cache: "false"

      - name: Install Kani
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"

      - name: Run Kani proofs
        run: cargo kani --features kani

  # ---------------------------------------------------------------------------
  # Benchmark: scheduled
  # ---------------------------------------------------------------------------
  benchmark:
    name: Benchmark (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux-bench

      - name: Run benchmarks
        run: |
          cargo bench --features bench --bench event_encoding -- --output-format bencher | tee output.txt
          cargo bench --features bench --bench offline_validation -- --output-format bencher | tee -a output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@4bdcce38c94cec68da58d012ac24b7b1155efe8b # v1
        with:
          tool: cargo
          output-file-path: output.txt
          alert-threshold: "130%"
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'schedule' }}

  # ---------------------------------------------------------------------------
  # Nightly summary — surfaces failures via GitHub's default email notifications
  # ---------------------------------------------------------------------------
  nightly-summary:
    name: Nightly Summary
    if: always() && github.event_name == 'schedule'
    needs: [test-full-harness, loom, fuzz-linux, fuzz-macos, miri, kani, benchmark, asan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::One or more nightly jobs failed. Check the workflow run for details."
          exit 1
