name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ---------------------------------------------------------------------------
  # Path filtering — skip expensive jobs on docs-only PRs
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'default_rules.yaml'
              - '.github/**'
            fuzz:
              - 'fuzz/**'
              - 'src/**'

  # ---------------------------------------------------------------------------
  # fmt → clippy → test  (serial chain, shared cache)
  # ---------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # No cache needed — fmt does not compile
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    needs: [fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy
          shared-key: stable-linux

      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [clippy]
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule') && '32' || '4' }}
      PROPTEST_FUZZ_MULTIPLIER: ${{ (github.event_name == 'schedule') && '2' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo test --features stdx-proptest,integration-tests,property-tests,diagnostic-tests,smoke-tests

  clippy-aarch64:
    name: Clippy (aarch64)
    runs-on: macos-15
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    needs: [changes]
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: brew install boost
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-macos
          cache-all-crates: "true"
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test-aarch64:
    name: Test (aarch64)
    runs-on: macos-15
    needs: [clippy-aarch64]
    env:
      PROPTEST_CASES: ${{ (github.event_name == 'schedule') && '32' || '4' }}
      PROPTEST_FUZZ_MULTIPLIER: ${{ (github.event_name == 'schedule') && '2' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: brew install boost
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: stable-macos
          cache-all-crates: "true"
          save-if: "false"
      - run: cargo test --features stdx-proptest,integration-tests,property-tests,diagnostic-tests,smoke-tests

  # ---------------------------------------------------------------------------
  # Scheduled: full harness (runs after clippy for cache reuse)
  # ---------------------------------------------------------------------------
  test-full-harness:
    name: Test (Scheduled, Full Harness)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    needs: [clippy]
    env:
      PROPTEST_CASES: "64"
      PROPTEST_FUZZ_MULTIPLIER: "4"
      SCHEDULER_SIM_STRESS_SEEDS: "2000"
      SCHEDULER_SIM_STRESS_MAX_STEPS: "2000"
      SCHEDULER_SIM_STRESS_MAX_PROGRAMS: "8"
      SCHEDULER_SIM_STRESS_MAX_TASKS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux
          save-cache: "false"

      - run: cargo test --lib --bins --tests --examples --features stdx-proptest,tiger-harness,scheduler-sim,integration-tests,property-tests,diagnostic-tests,smoke-tests,perf-stats

  loom:
    name: Loom Concurrency Tests
    runs-on: ubuntu-22.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-loom
      - name: Run loom tests
        env:
          RUSTFLAGS: "--cfg loom"
        run: cargo test --lib -- loom_tests

  # ---------------------------------------------------------------------------
  # Security audit (independent, always runs)
  # ---------------------------------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Fuzz: PR smoke test
  # ---------------------------------------------------------------------------
  fuzz-pack-smoke:
    name: Fuzz Pack Smoke (PR)
    if: github.event_name == 'pull_request' && needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    needs: [changes]
    env:
      FUZZ_SECONDS: 20
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          shared-key: nightly-linux-fuzz
          extra-apt: "clang llvm"
          cache-workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | bash
          cargo binstall --no-confirm --force cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-pack-${{ hashFiles('fuzz/corpus/fuzz_pack_*/**') }}
          restore-keys: |
            fuzz-corpus-pack-

      - name: Run pack fuzz targets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_pack_parse_delta    --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream  --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_delta_into      --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}
          cargo +nightly fuzz run fuzz_pack_exec            --target x86_64-unknown-linux-gnu -- -max_total_time=${FUZZ_SECONDS}

  # ---------------------------------------------------------------------------
  # Fuzz: scheduled nightly (Linux)
  # ---------------------------------------------------------------------------
  fuzz-linux:
    name: Fuzz (Scheduled, Nightly Only, Linux)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      FUZZ_RUNS: 10000
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          shared-key: nightly-linux-fuzz
          extra-apt: "clang llvm"
          cache-workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | bash
          cargo binstall --no-confirm --force cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-nightly-linux-${{ hashFiles('fuzz/corpus/fuzz_pack_*/**') }}
          restore-keys: |
            fuzz-corpus-nightly-linux-

      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run fuzz_anchor_soundness --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_build_and_scan --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_determinism --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_differential --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_parse_delta --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_delta_into --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_exec --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_json_write_equivalence --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_encode_pipeline --target x86_64-unknown-linux-gnu -- -runs=${FUZZ_RUNS}

  # ---------------------------------------------------------------------------
  # Fuzz: scheduled nightly (macOS)
  # ---------------------------------------------------------------------------
  fuzz-macos:
    name: Fuzz (Scheduled, Nightly Only, macOS)
    if: github.event_name == 'schedule'
    runs-on: macos-15
    env:
      FUZZ_RUNS: 10000
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-macos-fuzz
          cache-all-crates: "true"

      - name: Install system deps
        run: brew install boost

      - name: Install cargo-fuzz
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh \
            | bash
          cargo binstall --no-confirm --force cargo-fuzz

      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-nightly-macos-${{ hashFiles('fuzz/corpus/fuzz_pack_*/**') }}
          restore-keys: |
            fuzz-corpus-nightly-macos-

      - name: Run fuzz targets
        working-directory: fuzz
        run: |
          export BOOST_ROOT="$(brew --prefix boost)"
          export CMAKE_PREFIX_PATH="${BOOST_ROOT}:${CMAKE_PREFIX_PATH:-}"
          cargo +nightly fuzz run fuzz_anchor_soundness -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_build_and_scan -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_determinism -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_b64_gate_differential -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_parse_delta -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_inflate_stream -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_delta_into -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_pack_exec -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_json_write_equivalence -- -runs=${FUZZ_RUNS}
          cargo +nightly fuzz run fuzz_encode_pipeline -- -runs=${FUZZ_RUNS}

  # ---------------------------------------------------------------------------
  # Miri: scheduled nightly
  # ---------------------------------------------------------------------------
  miri:
    name: Miri (Scheduled, Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ""
      MIRIFLAGS: >-
        -Zmiri-strict-provenance
        -Zmiri-symbolic-alignment-check
        -Zmiri-preemption-rate=0.1
        -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: miri
          shared-key: nightly-linux-miri

      - name: Run Miri on lib tests (skip FFI-dependent modules)
        run: |
          cargo +nightly miri test --lib -- \
            --skip engine:: \
            --skip git_scan:: \
            --skip scheduler::affinity \
            --skip scheduler::device_slots \
            --skip scheduler::rusage \
            --skip scheduler::local_fs_uring \
            --skip scheduler::engine_impl \
            --skip scheduler::parallel_scan \
            --skip rules::yaml \
            --skip archive::scan \
            --skip archive::formats::gzip \
            --skip archive::formats::zip::tests::long_name \
            --skip archive::formats::zip::tests::in_memory

  # ---------------------------------------------------------------------------
  # Kani: scheduled verification
  # ---------------------------------------------------------------------------
  kani:
    name: Kani Verification (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev

      - name: Install Kani
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: "0.67.0"

      - name: Run Kani proofs
        run: cargo kani --features kani

  # ---------------------------------------------------------------------------
  # Benchmark: scheduled
  # ---------------------------------------------------------------------------
  benchmark:
    name: Benchmark (Scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: stable-linux-bench

      - name: Run benchmarks
        run: cargo bench --features bench --bench event_encoding -- --output-format bencher | tee output.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: output.txt
          alert-threshold: "130%"
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'schedule' }}
