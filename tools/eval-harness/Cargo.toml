[package]
name = "eval-harness"
version = "0.1.0"
edition = "2024"
publish = false

# Intentionally standalone — not a workspace member of the root crate.
# If [workspace] is ever added to root Cargo.toml, explicitly exclude
# this path or add it as a member.

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scanner-rs = { path = "../.." }

[dev-dependencies]
proptest = "1.5"
