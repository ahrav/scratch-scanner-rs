[package]
name = "eval-harness"
version = "0.1.0"
edition = "2024"
publish = false

# Intentionally standalone — not a workspace member of the root crate.
# Prevent cargo from walking up and claiming this as part of a parent workspace.
[workspace]
members = ["."]

[dependencies]
csv = "1.3"
memchr = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scanner-rs = { path = "../..", features = ["tiger-harness"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3"
